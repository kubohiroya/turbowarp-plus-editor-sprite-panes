<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>Sprite editor toolbar</title>
<link rel="stylesheet" href="../src/sprite-editor-toolbar.css">
<link rel="stylesheet" href="../src/sprite-layout-menu.css">
<style>
    .pane { width: min(680px, 100%); font: 13px system-ui, sans-serif; container-type: inline-size; }
</style>
<div class="pane" id="root"></div>
<div id="header" style="width: 150px; height: 30px; overflow: hidden; transform: translateX(0)"></div>
<output id="command"></output>
<script src="../node_modules/react/umd/react.development.js"></script>
<script src="../node_modules/react-dom/umd/react-dom.development.js"></script>
<script type="importmap">{"imports":{"react":"/example/react.js"}}</script>
<script type="module">
    import {SpriteEditorToolbar} from '../dist/sprite-editor-toolbar.js';
    import {createSpriteLayoutMenu} from '../dist/sprite-layout-menu.js';
    const output = document.getElementById('command');
    document.getElementById('header').append(createSpriteLayoutMenu(document, 'en', {
        splitRight: () => {output.textContent = 'right';},
        splitBelow: () => {output.textContent = 'below';},
        close: () => {output.textContent = 'closed';},
        canClose: () => output.textContent !== ''
    }).element);
    function Example() {
        const [locale, setLocale] = React.useState('ja');
        const [section, setSection] = React.useState('code');
        const [result, setResult] = React.useState('');
        return React.createElement(React.Fragment, null,
            React.createElement('button', {onClick: () => setLocale('en')}, 'English'),
            React.createElement(SpriteEditorToolbar, {
                viewId: 'demo', locale, section, onSectionChange: setSection, activeGroup: true,
                search: {
                    find: query => ['First block', 'Second block'].filter(label => label.includes(query))
                        .map(label => ({id: label, label})),
                    select: ({label}, currentSection) => setResult(currentSection + ': ' + label)
                }
            }),
            React.createElement('div', {id: 'demo-content', role: 'tabpanel',
                'aria-labelledby': 'demo-section-' + section}, result)
        );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Example));
</script>
</html>
